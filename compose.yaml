name: finance-tracker

services:
  postgres:
    image: postgres:17-alpine
    container_name: finance-tracker-postgres
    environment:
      POSTGRES_DB: finance_tracker
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - finance_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: finance-tracker-api:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["--Database:MigrateOnly=true"]
    environment: &api-environment
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=finance_tracker;Username=finance;Password=finance_dev
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env before starting the application}
      Http__RedirectToHttps: "false"
      Auth__SecureCookies: "false"
      Auth__FrontendUrl: http://localhost:${FRONTEND_PORT:-5180}
      Email__Provider: Mailpit
      Email__Endpoint: http://mailpit:8025/api/v1/send
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-}
      Telegram__BotUsername: ${TELEGRAM_BOT_USERNAME:-PetProjectFinanceBot}
      Auth__TelegramOnly: ${TELEGRAM_ONLY:-false}
      FinanceKeys__Enabled: ${MANAGED_FINANCIAL_KEYS:-false}
      FinanceKeys__ActiveKeyId: v1
      FinanceKeys__Keys__v1: ${FINANCIAL_WRAPPING_KEY:-}
      FinanceRecords__Enabled: ${SERVER_FINANCIAL_RECORDS:-false}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: finance-tracker-api:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5180}:80"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

volumes:
  finance_postgres_data:
