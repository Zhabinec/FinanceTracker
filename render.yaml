services:
  - type: web
    name: finance-tracker-zhabinec
    runtime: docker
    plan: free
    region: frankfurt
    branch: codex/platform-telegram
    dockerfilePath: ./deploy/render.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: '8080'
      - key: Http__RedirectToHttps
        value: 'false'
      - key: Auth__SecureCookies
        value: 'true'
      - key: Hosting__UseRenderExternalUrl
        value: 'true'
      - key: Database__MigrateOnStartup
        value: 'true'
      - key: Jwt__SigningKey
        generateValue: true
      - key: ConnectionStrings__Database
        sync: false
      - key: Telegram__BotToken
        sync: false
      - key: Telegram__BotUsername
        value: PetProjectFinanceBot
      - key: Auth__TelegramOnly
        value: 'true'
      - key: FinanceKeys__Enabled
        value: 'true'
      - key: FinanceKeys__ActiveKeyId
        value: v1
      - key: FinanceKeys__Keys__v1
        sync: false
      - key: Email__Provider
        value: Resend
      - key: Email__Endpoint
        value: https://api.resend.com/emails
      - key: Email__From
        sync: false
      - key: Email__ApiKey
        sync: false
  - type: web
    name: finance-tracker-telegram
    runtime: static
    branch: codex/platform-telegram
    buildCommand: npm ci --prefix frontend && npm run build --prefix frontend
    staticPublishPath: frontend/dist
    autoDeployTrigger: checksPass
    routes:
      - type: rewrite
        source: /api/*
        destination: https://finance-tracker-zhabinec.onrender.com/api/*
      - type: rewrite
        source: /health
        destination: https://finance-tracker-zhabinec.onrender.com/health
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org https://t.me"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /api/*
        name: Cache-Control
        value: no-store
      - path: /assets/*
        name: Cache-Control
        value: public,max-age=31536000,immutable
