name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/finance-gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/finance-gitleaks" gitleaks
      - name: Scan all fetched history with secrets redacted
        run: '"$RUNNER_TEMP/finance-gitleaks/gitleaks" git . --log-opts="--all" --redact=100 --no-banner'

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger trx

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        hosting: [compose, render]
    env:
      JWT_SIGNING_KEY: ci-only-ephemeral-key-never-use-in-deployment-123456789
      TELEGRAM_BOT_TOKEN: 123456789:test-only-synthetic-bot-token-never-a-real-secret
      E2E_TELEGRAM: 'true'
      TELEGRAM_ONLY: 'true'
      MANAGED_FINANCIAL_KEYS: 'true'
      SERVER_FINANCIAL_RECORDS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate ephemeral financial wrapping key
        run: echo "FINANCIAL_WRAPPING_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: docker compose config --quiet
      - name: Validate production Compose configuration
        env:
          APP_VERSION: ci-validation
          POSTGRES_PASSWORD: ci-only-config-validation
          PUBLIC_URL: https://finance.example.com
          EMAIL_FROM: finance@example.com
          EMAIL_API_KEY: ci-only-config-validation
          TLS_CERT_DIR: /tmp/finance-config-validation
        run: docker compose -f compose.production.yaml config --quiet
      - run: docker compose up -d --build
        if: matrix.hosting == 'compose'
      - name: Build and start the combined Render image
        if: matrix.hosting == 'render'
        run: |
          docker compose up -d postgres mailpit
          docker build -f deploy/render.Dockerfile -t finance-render:ci .
          docker run -d --name finance-render-ci --network finance-tracker_default -p 127.0.0.1:5180:8080 \
            -e 'ConnectionStrings__Database=Host=postgres;Port=5432;Database=finance_tracker;Username=finance;Password=finance_dev' \
            -e Jwt__SigningKey="$JWT_SIGNING_KEY" -e Telegram__BotToken="$TELEGRAM_BOT_TOKEN" \
            -e Auth__TelegramOnly=true -e FinanceKeys__Enabled=true -e FinanceKeys__ActiveKeyId=v1 \
            -e FinanceKeys__Keys__v1="$FINANCIAL_WRAPPING_KEY" -e FinanceRecords__Enabled=true \
            -e Database__MigrateOnStartup=true -e Http__RedirectToHttps=false -e Auth__SecureCookies=false \
            -e Hosting__UseRenderExternalUrl=true -e RENDER_EXTERNAL_URL=http://localhost:5180 \
            -e Email__Provider=Mailpit -e Email__Endpoint=http://mailpit:8025/api/v1/send finance-render:ci
      - run: curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://localhost:5180/health
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-${{ matrix.hosting }}
          path: |
            frontend/playwright-report
            frontend/test-results
      - run: docker compose logs --no-color
        if: failure()
      - run: docker logs finance-render-ci
        if: failure() && matrix.hosting == 'render'
      - run: docker compose down
        if: always()
