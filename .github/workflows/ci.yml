name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger trx

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JWT_SIGNING_KEY: ci-only-ephemeral-key-never-use-in-deployment-123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: docker compose config --quiet
      - name: Validate production Compose configuration
        env:
          APP_VERSION: ci-validation
          POSTGRES_PASSWORD: ci-only-config-validation
          PUBLIC_URL: https://finance.example.com
          EMAIL_FROM: finance@example.com
          EMAIL_API_KEY: ci-only-config-validation
          TLS_CERT_DIR: /tmp/finance-config-validation
        run: docker compose -f compose.production.yaml config --quiet
      - run: docker compose up -d --build
      - run: curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://localhost:5180/health
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            frontend/playwright-report
            frontend/test-results
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down
        if: always()
